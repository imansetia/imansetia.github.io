# Sinkron harian: ambil film baru dari RSS Letterboxd, lengkapi poster/sutradara
# dari TMDB dan sampul dari Open Library. Bila ada perubahan, commit ke `main`
# lalu jalankan workflow deploy.
#
# Jadwal: 22:17 UTC ≈ 05:17 WIB. Bisa juga dijalankan manual dari tab Actions.
# Secret yang dipakai: TMDB_API_KEY (opsional; tanpa itu langkah TMDB dilewati).
name: Sinkron harian

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repo (main)
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Siapkan Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Script sinkron aman gagal: bila sumber luar error, data lama dibiarkan.
      - name: Jalankan sinkron
        run: npm run sync
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Commit bila ada perubahan
        id: commit
        run: |
          git add src/data public/posters public/covers
          if git diff --cached --quiet; then
            echo "Tidak ada data baru."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Sinkron data $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push dari workflow tidak memicu workflow lain, jadi deploy dijalankan langsung.
      - name: Jalankan deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
